# Overlay annotations for shared global enums (module !GlobalTypes).
#
# These enums are registered once under !GlobalTypes and referenced across
# client and server.  They are matched to their schema records by name via the
# overlay name-fallback (see load_overlays / get_overlay in generate_docs.py),
# so this file's stem need not equal the binary module.
#
# First community pass over the schema enums (issue #21.2), which previously
# had zero coverage.  Descriptions are grounded in the shipped member names and
# well-established CS2 / Source 2 semantics; sentinel members (COUNT / MAX_BITS
# / LAST) are intentionally left unannotated.

# --- Physics / movement ------------------------------------------------------

SolidType_t:
  description: "Collision solid type used for an entity's physics representation (m_nSolidType)."
  fields:
    SOLID_NONE:
      description: "No collision."
    SOLID_BBOX:
      description: "Axis-aligned bounding box."
    SOLID_OBB:
      description: "Oriented bounding box."
    SOLID_SPHERE:
      description: "Sphere."
    SOLID_VPHYSICS:
      description: "Full VPhysics collision mesh."
    SOLID_CAPSULE:
      description: "Capsule (used by player/character collision)."
    SOLID_CYLINDER:
      description: "Cylinder."

MoveType_t:
  description: "How an entity is moved and simulated each tick (m_MoveType)."
  fields:
    MOVETYPE_NONE:
      description: "Not moved by the engine."
    MOVETYPE_WALK:
      description: "Player-style ground movement (walk/run/jump)."
    MOVETYPE_FLY:
      description: "Flies in a straight line, ignoring gravity."
    MOVETYPE_FLYGRAVITY:
      description: "Ballistic arc under gravity (thrown grenades, projectiles)."
    MOVETYPE_VPHYSICS:
      description: "Driven by the VPhysics simulation."
    MOVETYPE_PUSH:
      description: "Pushes other entities without being blocked (movers/doors)."
    MOVETYPE_NOCLIP:
      description: "Free movement with no collision (noclip)."
    MOVETYPE_OBSERVER:
      description: "Spectator free-look movement."
    MOVETYPE_LADDER:
      description: "Climbing a ladder."
    MOVETYPE_CUSTOM:
      description: "Movement handled by custom game code."

MoveCollide_t:
  description: "How a moving entity resolves collisions along its path (fly-movetype entities)."

# --- Rendering ---------------------------------------------------------------

RenderMode_t:
  description: "Transparency / rendering method for a model entity (m_nRenderMode)."
  fields:
    kRenderNormal:
      description: "Opaque, standard rendering."
    kRenderTransAlpha:
      description: "Alpha-blended translucency."
    kRenderNone:
      description: "Not rendered (invisible but still present)."

RenderFx_t:
  description: "Special render effect applied to an entity (pulse / fade / strobe / glow variants; m_nRenderFX)."

# --- Player / life state -----------------------------------------------------

LifeState_t:
  description: "Alive/dead state of a pawn (m_lifeState)."
  fields:
    LIFE_ALIVE:
      description: "Alive and playable."
    LIFE_DYING:
      description: "Playing the death animation; not yet fully dead."
    LIFE_DEAD:
      description: "Dead."
    LIFE_RESPAWNABLE:
      description: "Dead and eligible to respawn."
    LIFE_RESPAWNING:
      description: "In the process of respawning."

CSPlayerState:
  description: "Connection / spawn state machine for a CS2 player (m_iPlayerState)."
  fields:
    STATE_ACTIVE:
      description: "In active play, controlling a pawn."
    STATE_WELCOME:
      description: "Just connected; showing the intro / welcome screen."
    STATE_PICKINGTEAM:
      description: "Choosing a team."
    STATE_DEATH_ANIM:
      description: "Playing the death animation."
    STATE_OBSERVER_MODE:
      description: "Spectating (dead or connected as an observer)."
    STATE_DORMANT:
      description: "Not yet fully in the game (loading / intermission)."

ObserverMode_t:
  description: "Spectator camera mode (m_iObserverMode)."
  fields:
    OBS_MODE_NONE:
      description: "Not observing."
    OBS_MODE_FIXED:
      description: "Fixed camera position."
    OBS_MODE_IN_EYE:
      description: "First-person: sees through the observed player's eyes."
    OBS_MODE_CHASE:
      description: "Third-person chase camera behind the observed player."
    OBS_MODE_ROAMING:
      description: "Free-roaming (free-fly) camera."

ObserverInterpState_t:
  description: "Transition state of the spectator camera as it moves between targets."

# --- Weapons -----------------------------------------------------------------

CSWeaponType:
  description: "Broad weapon type classification (CCSWeaponBaseVData.m_WeaponType)."
  fields:
    WEAPONTYPE_C4:
      description: "The bomb (C4)."
    WEAPONTYPE_TASER:
      description: "The zeus x27 taser."
    WEAPONTYPE_GRENADE:
      description: "A throwable grenade."
    WEAPONTYPE_EQUIPMENT:
      description: "Equipment (kevlar, defuse kit, and similar non-firing items)."

CSWeaponCategory:
  description: "Coarse buy-menu weapon category (CCSWeaponBaseVData.m_WeaponCategory)."

CSWeaponMode:
  description: "Weapon fire mode: primary vs secondary (right-click) fire."
  fields:
    Primary_Mode:
      description: "Primary fire."
    Secondary_Mode:
      description: "Secondary fire (e.g. scope, burst, silencer toggle)."

CSWeaponSilencerType:
  description: "Whether and how a weapon is silenced."
  fields:
    WEAPONSILENCER_NONE:
      description: "No silencer."
    WEAPONSILENCER_DETACHABLE:
      description: "Detachable silencer (M4A1-S, USP-S)."
    WEAPONSILENCER_INTEGRATED:
      description: "Permanently integrated silencer."

gear_slot_t:
  description: "Gear slot a weapon occupies on the player (weapon-switch wheel grouping)."
  fields:
    GEAR_SLOT_RIFLE:
      description: "Primary weapon slot (rifles, SMGs, shotguns, LMGs)."
    GEAR_SLOT_PISTOL:
      description: "Secondary weapon slot (pistols)."
    GEAR_SLOT_KNIFE:
      description: "Melee slot (knife)."
    GEAR_SLOT_GRENADES:
      description: "Grenade slot."
    GEAR_SLOT_C4:
      description: "Bomb (C4) slot."

loadout_slot_t:
  description: >
    Full per-loadout equipment-slot enumeration (weapons, grenades, and
    cosmetic/agent slots).  Used to index CCSPlayerController_InventoryServices
    loadout data.

# --- Misc gameplay -----------------------------------------------------------

MedalRank_t:
  description: "Medal tier for profile achievements (none / bronze / silver / gold)."

ShakeCommand_t:
  description: "Screen-shake command type sent to clients (start / stop / amplitude / frequency / duration)."
