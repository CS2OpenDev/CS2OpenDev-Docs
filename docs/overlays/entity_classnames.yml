# Classnames that exist only at run time: the game creates these entities
# itself, so no FGD declares them and they have no /entities/ page, but
# scripts look them up by name (FindEntitiesByClass("player") is the usual
# way to reach every pawn).  Keys must NOT be FGD classnames.
runtime:
  cs_player_controller: {class: CCSPlayerController, module: server}
  observer: {class: CCSObserverPawn, module: server}
  planted_c4: {class: CPlantedC4, module: server}
  player: {class: CCSPlayerPawn, module: server}
