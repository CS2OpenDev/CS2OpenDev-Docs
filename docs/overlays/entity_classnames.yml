# docs/overlays/entity_classnames.yml
#
# Hammer classname -> server schema class, for the entity I/O pages
# (/entities/<classname>/) and the cs_script typings.  The game joins the two
# through CEntityClass::m_designerName, which SchemaTracker does not extract
# yet (CS2OpenDev-SchemaTracker#35); until it does, this list is curated.
#
# The first block was seeded by docs/tools/seed_entity_classnames.py, which
# matches spellings such as C<Name>, CCS<Name> and C<Rest> against server
# classes that descend from CBaseEntity, and then reviewed by hand (wrong
# guesses such as hostage_entity -> CBaseEntity were dropped).  The second
# block is hand-written for classnames whose class name does not follow from
# the classname.  Every key must be a classname in entity_io.json and every
# class a server class in the schema; --strict fails otherwise.
#
# Format reference: docs/overlays/README.md

