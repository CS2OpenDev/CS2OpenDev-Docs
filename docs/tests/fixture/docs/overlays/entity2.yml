CEntityInstance:
  description: 'Root of the entity class hierarchy (server and client).  Everything that has an entity
    handle ultimately derives from this.

    '
  fields:
    m_CScriptComponent:
      description: VScript component attached to the entity, when scripted.
    m_pEntity:
      description: 'CEntityIdentity pointer: the entity''s identity record (name, class, handle, flags).'
