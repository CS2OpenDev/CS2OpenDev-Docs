syntax = "proto2";

// Injected by CS2OpenDev-Docs (issue #21.3): a single shared C# namespace
// so message types don't land in the global namespace (CS0433 hazard).
option csharp_namespace = "CS2OpenDev.Protobuf";

message NetMessageSplitscreenUserChanged {
  optional uint32 slot = 1;
}

message NetMessageConnectionClosed {
  optional uint32 reason = 1;
  optional string message = 2;
}

message NetMessageConnectionCrashed {
  optional uint32 reason = 1;
  optional string message = 2;
}

message NetMessagePacketStart {
}

message NetMessagePacketEnd {
}
