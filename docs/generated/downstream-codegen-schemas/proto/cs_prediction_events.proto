syntax = "proto2";

// Injected by CS2OpenDev-Docs (issue #21.3): a single shared C# namespace
// so message types don't land in the global namespace (CS0433 hazard).
option csharp_namespace = "CS2OpenDev.Protobuf";

import "networkbasetypes.proto";
// Removed by CS2OpenDev-Docs (issue #21.3): unresolved import "prediction_events.proto" (not shipped in this set).

enum ECSPredictionEvents {
  CSPE_DamageTag = 1;
  CSPE_PlayerTeleport = 3;
}

message CCSPredictionEvent_DamageTag {
  optional float flinch_mod_small = 1;
  optional float flinch_mod_large = 2;
  optional float friendly_fire_damage_reduction_ratio = 3;
}

message CCSPredictionEvent_PlayerTeleport {
  optional bool relative = 1;
  optional .CMsgVector origin = 2;
  optional .CMsgQAngle angles = 3;
  optional .CMsgVector velocity = 4;
}
