name: Generate Documentation

on:
  # Poll for upstream changes every 4 hours
  schedule:
    - cron: "0 */4 * * *"

  # Rebuild immediately when overlays, the generator, or workflow config change
  push:
    paths:
      - "docs/overlays/**"
      - "docs/generate_docs.py"
      - ".github/workflows/generate-docs.yml"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Only one docs build at a time per branch; cancel any in-progress run
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 1. Materialise the latest SchemaTracker build from its `latest` branch (a
  #    shallow single-branch clone, so the multi-GB history is never fetched),
  #    regenerate docs, then either push directly (push event) or open/update a
  #    PR (schedule / dispatch).  The commit is diff-gated, so an unchanged
  #    latest build produces no PR.
  # -------------------------------------------------------------------------
  check-and-update:
    name: Regenerate docs from latest SchemaTracker build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Shallow single-branch clone of the SchemaTracker `latest` branch, which
      # carries only the newest build (artifacts/<build_id>/<platform>/) plus a
      # root LATEST.json pointer — tens of MB rather than the whole artifacts/
      # tree.  CS2OpenDev-SchemaTracker is public, so the plain HTTPS URL clones
      # without credentials (no token needed).
      - name: Materialise latest SchemaTracker build (latest branch)
        id: tracker
        run: |
          set -euo pipefail
          URL="https://github.com/CS2OpenDev/CS2OpenDev-SchemaTracker.git"
          rm -rf upstream/schema-tracker
          git clone --depth 1 --single-branch --branch latest "$URL" upstream/schema-tracker

          # The `latest` branch carries the cumulative
          # artifacts/schema_evolution/<platform>.json files (maintained by
          # SchemaTracker's publish-latest workflow) alongside the newest build,
          # so the Schema History page + field_history.json render straight from
          # this shallow clone — no supplemental fetch needed.  (SchemaTracker's
          # default branch is a clean, artifact-free history and is NOT a source
          # for these files.)

          # Build id comes straight from the branch's LATEST.json pointer.
          BUILD=$(python3 -c "import json;print(json.load(open('upstream/schema-tracker/LATEST.json'))['build_id'])")
          SHA=$(git -C upstream/schema-tracker rev-parse HEAD)
          echo "Latest build: $BUILD (branch commit $SHA)"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"      >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml protobuf -q

      - name: Generate documentation
        run: |
          python3 docs/generate_docs.py \
            --repo-root . \
            --artifacts-root ./upstream/schema-tracker/artifacts \
            --build latest \
            --platform windows-x86_64 \
            --output docs

      # On direct push events we commit straight to the current branch.
      - name: Commit and push (push event)
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: regenerate for SchemaTracker build ${{ steps.tracker.outputs.build }} [skip ci]"
            git push
          fi

      # On scheduled / manual runs, open (or update) a PR so changes are
      # visible and can be reviewed before landing on the default branch.
      - name: Open or update pull request (schedule / workflow_dispatch)
        if: github.event_name != 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: regenerate for SchemaTracker build ${{ steps.tracker.outputs.build }} [skip ci]"
          branch: automated/docs-update
          delete-branch: true
          title: "docs: automated update for SchemaTracker build ${{ steps.tracker.outputs.build }}"
          body: |
            Automated documentation update triggered by the `${{ github.event_name }}` event.

            **SchemaTracker build**: `${{ steps.tracker.outputs.build }}` (commit `${{ steps.tracker.outputs.sha }}`)

            This pull request was created automatically by the [Generate Documentation](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.
          labels: automated,documentation

  # -------------------------------------------------------------------------
  # 2. Build Jekyll site from the docs/ directory.
  #    Checks out the branch HEAD so it always picks up any commit pushed
  #    by the check-and-update job above.
  # -------------------------------------------------------------------------
  build:
    name: Build Jekyll documentation
    runs-on: ubuntu-latest
    needs: check-and-update
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository (latest HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # -------------------------------------------------------------------------
  # 3. Deploy to GitHub Pages (only from the default branch).
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
