name: Generate Documentation

on:
  # Poll for upstream changes every 4 hours
  schedule:
    - cron: "0 */4 * * *"

  # Rebuild immediately when overlays, the generator, its tests, or the site change
  push:
    paths:
      - "docs/overlays/**"
      - "docs/generate_docs.py"
      - "docs/site_data.py"
      - "docs/tests/**"
      - "site/**"
      - ".github/workflows/generate-docs.yml"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Only one docs build at a time per branch; cancel any in-progress run
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 1. Materialise the latest SchemaTracker build from its `latest` branch (a
  #    shallow single-branch clone, so the multi-GB history is never fetched),
  #    regenerate docs, run the generator's tests, and commit any diff straight
  #    to the current branch. The commit is diff-gated, so an unchanged latest
  #    build is a no-op. (The org forbids Actions from opening PRs, and the
  #    generated docs are deterministic, so we commit directly rather than via
  #    a review PR - the site build + deploy jobs then publish the freshly
  #    committed docs in the same run.)
  # -------------------------------------------------------------------------
  check-and-update:
    name: Regenerate docs from latest SchemaTracker build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      # fetch-depth 1: the job only reads and commits on top of the branch tip,
      # never diffs against older history.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Shallow single-branch clone of the SchemaTracker `latest` branch, which
      # carries only the newest build (artifacts/<build_id>/<platform>/) plus a
      # root LATEST.json pointer - tens of MB rather than the whole artifacts/
      # tree. CS2OpenDev-SchemaTracker is public, so the plain HTTPS URL clones
      # without credentials (no token needed).
      - name: Materialise latest SchemaTracker build (latest branch)
        id: tracker
        run: |
          set -euo pipefail
          URL="https://github.com/CS2OpenDev/CS2OpenDev-SchemaTracker.git"
          rm -rf upstream/schema-tracker
          git clone --depth 1 --single-branch --branch latest "$URL" upstream/schema-tracker

          # The `latest` branch carries the cumulative
          # artifacts/schema_evolution/<platform>.json files (maintained by
          # SchemaTracker's publish-latest workflow) alongside the newest build,
          # so the Schema History page + field_history.json render straight from
          # this shallow clone - no supplemental fetch needed. (SchemaTracker's
          # default branch is a clean, artifact-free history and is NOT a source
          # for these files.)

          # Build id comes straight from the branch's LATEST.json pointer.
          BUILD=$(python3 -c "import json;print(json.load(open('upstream/schema-tracker/LATEST.json'))['build_id'])")
          SHA=$(git -C upstream/schema-tracker rev-parse HEAD)
          echo "Latest build: $BUILD (branch commit $SHA)"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"      >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml protobuf -q

      # --strict turns unresolved overlay keys and site-data warnings into a
      # build failure instead of a silent gap in the generated output.
      - name: Generate documentation
        run: |
          python3 docs/generate_docs.py \
            --repo-root . \
            --artifacts-root ./upstream/schema-tracker/artifacts \
            --build latest \
            --platform windows-x86_64 \
            --output docs \
            --strict

      - name: Run generator tests
        run: python3 -m unittest discover -s docs/tests -t docs/tests

      # Diff-gated: an unchanged build is a no-op, and downstream jobs read
      # `changed` instead of re-deriving it from git state themselves. A
      # GITHUB_TOKEN push does not re-trigger this workflow (loop-safe); the
      # [skip ci] tag is belt-and-suspenders.
      - name: Commit regenerated docs
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet -- docs/; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs: regenerate for SchemaTracker build ${{ steps.tracker.outputs.build }} [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # -------------------------------------------------------------------------
  # 2. Build the Astro site from docs/generated/ and run the verification
  #    scripts against the output. Skipped on an unchanged schedule run so a
  #    no-op poll doesn't spend a full site build; manual runs and pushes
  #    always build so a site-only change (no docs diff) still deploys.
  # -------------------------------------------------------------------------
  build-site:
    name: Build Astro site
    runs-on: ubuntu-latest
    needs: check-and-update
    if: needs.check-and-update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # Re-checkout at the branch tip: must see the commit job 1 just pushed.
      - name: Checkout repository (latest HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      # 6144 MB headroom over the ~1.6 GB observed peak; a static build has no
      # server process competing for the runner's memory.
      - name: Build site
        working-directory: site
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build

      - name: Verify site output
        working-directory: site
        run: npm run check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # -------------------------------------------------------------------------
  # 3. Deploy to GitHub Pages (only from the default branch).
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build-site
    # Only publish the live site from the default branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
